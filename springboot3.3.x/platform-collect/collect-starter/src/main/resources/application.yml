server:
port: 8080

spring:
application:
name: platform-collect

# 数据源配置
datasource:
url: jdbc:mysql://localhost:3306/collect?useUnicode=true&characterEncoding=utf8
username: root
password: root
driver-class-name: com.mysql.cj.jdbc.Driver

# Redis配置
redis:
host: localhost
port: 6379
database: 0

# MongoDB配置
data:
mongodb:
uri: mongodb://localhost:27017/collect

# RabbitMQ配置
rabbitmq:
host: localhost
port: 5672
username: guest
password: guest

# 监控端点配置
management:
endpoints:
web:
exposure:
include: "*"
endpoint:
health:
show-details: always

# 日志配置
logging:
level:
com.study.collect: info
file:
name: logs/collect.log