server:
  port: 8080

spring:
  application:
    name: platform-collect


  # 允许bean覆盖(解决taskScheduler冲突)
  main:
    allow-bean-definition-overriding: true
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

  # 数据源配置
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://192.168.80.137:3306/collect?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456

  # MongoDB配置
  data:
    mongodb:
      uri: mongodb://root:123456@192.168.80.137:27017
      database: crawler
      # 连接池配置
      connection:
        pool:
          max-size: 200
          min-size: 20
          max-wait-time: 5000
          max-connection-life-time: 1800000
          max-connection-idle-time: 600000
      # 读写配置
      read-preference: primaryPreferred
      write-concern: majority
      read-concern: local
      # 超时配置
      socket:
        connect-timeout: 5000
        read-timeout: 5000
      # 添加索引相关配置
      index:
        background: true
        creation-enabled: true
        creation-timeout: 5000 # 单位：毫秒
      # 其他配置
      auto-index-creation: true
      field-naming-strategy: org.springframework.data.mapping.model.SnakeCaseFieldNamingStrategy

    # Redis配置
    redis:
      password: 123456
      timeout: 5000
      cluster:
        nodes:
          - 192.168.80.137:6379
          - 192.168.80.137:6380
          - 192.168.80.137:6381
          - 192.168.80.137:6382
          - 192.168.80.137:6383
          - 192.168.80.137:6384
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: 1000

  # RabbitMQ配置
  rabbitmq:
    host: 192.168.80.137
    port: 5672
    username: admin
    password: 123456
    listener:
      simple:
        # 配置消费者
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          max-interval: 10000
          multiplier: 2.0
        # 设置手动确认
        acknowledge-mode: manual

# 监控端点配置
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

# 日志配置
logging:
  level:
    com.study.collect: info
  file:
    name: logs/collect.log

# 采集任务配置
collect:
  task:
    enabled: true
    thread-pool:
      core-size: 10
      max-size: 20
      queue-capacity: 200
    execution:
      timeout: 3600
      retry-times: 3
      retry-interval: 300

  mq:
    rabbit:
      host: 192.168.80.137
      port: 5672
      username: admin
      password: 123456
      enabled: true
      task:
        exchange: collect.task
        queue: collect.task.queue
        routing-key: collect.task
      result:
        exchange: collect.result
        queue: collect.result.queue
        routing-key: collect.result
  server:
    url: http://your-server-url
  check:
    cron: "0 0 * * * *"  # 每小时检查一次
  root-nodes:  # 可选配置，如果不配置则需要实现getDefaultRootNodes()方法
    - node1
    - node2